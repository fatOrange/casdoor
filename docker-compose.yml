# Runs the prebuilt image `swr.cn-east-3.myhuaweicloud.com/digitprint/casdoor:latest` from SWR.
# The database is external: this stack does not bundle one, so `dataSourceName` must point at an
# existing PostgreSQL instance. Set `dataSourceName`, `origin`, and `initAdminPassword` first.
services:
  casdoor:
    image: swr.cn-east-3.myhuaweicloud.com/digitprint/casdoor:latest
    pull_policy: always
    restart: always
    ports:
      - 8000:8000
    environment:
      - driverName=${driverName:-postgres}
      - dataSourceName=${dataSourceName:?}
      - dbName=${dbName:-casdoor}
      - origin=${origin:?}
      - originFrontend=${origin}
      - socks5Proxy=
      - initAdminPassword=${initAdminPassword:?}
    volumes:
      - casdoor_files:/files
      - casdoor_sessions:/tmp

volumes:
  casdoor_files:
  casdoor_sessions:
